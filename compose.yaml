services:
  bitchx:
    build:
      context: .
      args:
        USER_ID: ${UID}
        GROUP_ID: ${GID}
        USER_NAME: ${USER_NAME:-you}
    image: bitchx:local
    container_name: bitchx_session
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color
      - NICK=${NICK:-you}
      - IRCNAME=${IRCNAME:-You}
    user: "${UID}:${GID}"
    volumes:
      - ./config:/home/${USER_NAME:-you}/.BitchX
      - ./osiris-config:/home/${USER_NAME:-you}/osiris
      - ./config/.ircrc:/home/${USER_NAME:-you}/.ircrc
      - ./config/.ircservers:/home/${USER_NAME:-you}/.ircservers
      - ./launch-bx.sh:/home/${USER_NAME:-you}/launch-bx.sh
